<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../assets/css/wordup.css">
  <script defer src="../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-empty" style="max-width:460px">
      <div class="wu-empty__icon" style="width:80px;height:80px;background:var(--wu-info-bg)">
        <svg class="wu-icon" style="width:38px;height:38px;color:var(--wu-info)"><use href="#i-clock"></use></svg>
      </div>
      <div class="wu-eyebrow">Maintenance · 503</div>
      <h1 class="wu-empty__title" style="font-size:1.6rem">Word Up is getting an update — back soon</h1>
      <p class="wu-empty__text">We’re making things better behind the scenes. This usually takes a few minutes. Nothing you’ve done is lost — everything will be right where you left it.</p>
      <div class="wu-scripture" style="max-width:400px;margin:0 auto var(--wu-s6)">“Be still, and know that I am God.”<span class="wu-scripture__ref">Psalm 46:10</span></div>
      <div class="wu-cluster" style="justify-content:center">
        <button class="wu-btn wu-btn--primary" onclick="location.reload()"><svg class="wu-icon"><use href="#i-refresh"></use></svg>Check again</button>
      </div>
    </div>
  </div>
</body>
</html>
