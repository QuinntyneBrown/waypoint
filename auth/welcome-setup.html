<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Word Up · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../assets/css/wordup.css">
  <script defer src="../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-authcard" style="max-width:520px">
      <div class="wu-authcard__brand">
        <span class="wu-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--wu-font-head);font-weight:700;font-size:1.2rem">Word Up</span>
      </div>

      <h1 style="font-size:1.5rem;text-align:center">Let's set you up</h1>
      <p class="wu-muted wu-text-c wu-mb-6">A few quick steps and you're ready to go.</p>

      <div class="wu-segment wu-mb-6" role="tablist" aria-label="Setup steps">
        <span class="wu-segment__item is-active">1 · You</span>
        <span class="wu-segment__item">2 · Cohort</span>
        <span class="wu-segment__item">3 · Alerts</span>
      </div>

      <!-- STEP 1 (active) -->
      <div class="wu-stack">
        <div class="wu-cluster" style="justify-content:center">
          <span class="wu-avatar wu-avatar--xl" data-name="Jayden Alcantara"></span>
          <button class="wu-btn wu-btn--secondary wu-btn--sm" type="button" data-toast="Camera not available in demo" data-toast-type="info">
            <svg class="wu-icon"><use href="#i-camera"></use></svg>Add photo
          </button>
        </div>
        <p class="wu-muted wu-text-c wu-text-sm">Photo is optional — you can add one anytime from your profile.</p>

        <div class="wu-field">
          <label class="wu-label" for="dname">Display name <span class="wu-label__req">*</span></label>
          <input class="wu-input" id="dname" type="text" value="Jayden Alcantara">
        </div>
        <div class="wu-field">
          <label class="wu-label" for="pron">Pronouns</label>
          <select class="wu-select" id="pron">
            <option>Prefer not to say</option>
            <option>He / him</option>
            <option>She / her</option>
            <option>They / them</option>
          </select>
        </div>
      </div>

      <!-- STEP 2 (inert preview) -->
      <div class="wu-card wu-card--greige wu-mt-6" aria-hidden="true">
        <div class="wu-card__body">
          <div class="wu-eyebrow">Step 2 · Confirm your cohort</div>
          <div class="wu-person wu-mt-4">
            <span class="wu-avatar" data-name="Marcus Bello"></span>
            <div>
              <div class="wu-person__name">Rexdale Fall '25</div>
              <div class="wu-person__meta">Mentor Marcus Bello · Sep–Dec 2025</div>
            </div>
          </div>
        </div>
      </div>

      <!-- STEP 3 (inert preview) -->
      <div class="wu-card wu-card--greige wu-mt-4" aria-hidden="true">
        <div class="wu-card__body">
          <div class="wu-eyebrow wu-mb-4">Step 3 · Notifications</div>
          <label class="wu-switch"><input type="checkbox" checked disabled><span class="wu-switch__track"></span><span>Lesson reminders</span></label>
          <label class="wu-switch"><input type="checkbox" checked disabled><span class="wu-switch__track"></span><span>Mentor messages</span></label>
          <label class="wu-switch"><input type="checkbox" disabled><span class="wu-switch__track"></span><span>Announcements</span></label>
        </div>
      </div>

      <div class="wu-cluster wu-mt-6" style="justify-content:space-between">
        <a class="wu-btn wu-btn--ghost" href="../youth/home.html">Skip for now</a>
        <button class="wu-btn wu-btn--primary wu-btn--lg" data-toast="You're all set!" data-toast-type="success" data-toast-title="Welcome" data-then="youth/home.html">Finish</button>
      </div>
    </div>
  </div>
</body>
</html>
