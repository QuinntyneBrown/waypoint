<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../assets/css/wordup.css">
  <script defer src="../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-authcard">
      <div class="wu-authcard__brand">
        <span class="wu-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--wu-font-head);font-weight:700;font-size:1.2rem">Word Up</span>
      </div>
      <h1 style="font-size:1.5rem;text-align:center">Welcome back</h1>
      <p class="wu-muted wu-text-c wu-mb-6">Sign in to continue your journey.</p>

      <!-- Inline error example: add "is-error" to the email field below to preview the error state (off by default). -->
      <form onsubmit="event.preventDefault()">
        <div class="wu-field">
          <label class="wu-label" for="email">Email</label>
          <input class="wu-input" id="email" type="email" placeholder="you@example.com" value="jayden@email.com">
          <div class="wu-error-text">We don’t recognize that email.</div>
        </div>
        <div class="wu-field">
          <label class="wu-label" for="pw">Password</label>
          <input class="wu-input" id="pw" type="password" placeholder="••••••••">
        </div>

        <div class="wu-cluster wu-justify-between wu-mb-4">
          <label class="wu-check" style="margin-bottom:0">
            <input type="checkbox">
            <span class="wu-check__box"><svg class="wu-icon"><use href="#i-check"></use></svg></span>
            <span>Remember me</span>
          </label>
          <a class="wu-text-sm" href="./forgot-password.html">Forgot password?</a>
        </div>
        <p class="wu-help wu-mb-6" style="margin-top:0">Not recommended on shared devices.</p>

        <button class="wu-btn wu-btn--primary wu-btn--block wu-btn--lg" type="button"
          data-toast="Signed in" data-toast-type="success" data-toast-title="Welcome back" data-then="youth/home.html">Sign in</button>
      </form>

      <div class="wu-cluster wu-gap-3 wu-mt-6 wu-mb-6" style="flex-wrap:nowrap">
        <span class="wu-divider" style="flex:1;margin-block:0"></span>
        <span class="wu-muted wu-text-sm">or</span>
        <span class="wu-divider" style="flex:1;margin-block:0"></span>
      </div>

      <button class="wu-btn wu-btn--ghost wu-btn--block wu-btn--lg" type="button"
        data-toast="Continuing with Google (demo)" data-toast-type="info">
        <svg class="wu-icon"><use href="#i-log-in"></use></svg>Sign in with Google</button>

      <p class="wu-text-c wu-mt-6 wu-text-sm"><a href="./pin-login.html">Use a PIN instead</a></p>
      <p class="wu-text-c wu-mt-4 wu-text-sm wu-muted">New here? Ask your mentor for an invite.</p>
    </div>
  </div>
</body>
</html>
