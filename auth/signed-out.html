<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../assets/css/wordup.css">
  <script defer src="../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-authcard wu-text-c">
      <div class="wu-authcard__brand" style="justify-content:center">
        <span class="wu-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--wu-font-head);font-weight:700;font-size:1.2rem">Word Up</span>
      </div>

      <div class="wu-modal__icon wu-modal__icon--success" style="margin-inline:auto">
        <svg class="wu-icon"><use href="#i-check-circle"></use></svg>
      </div>

      <h1 style="font-size:1.75rem">You've been signed out</h1>
      <p class="wu-mb-6" style="font-size:1.15rem;max-width:32ch;margin-inline:auto">
        This device is ready for the next person.
      </p>

      <div class="wu-alert wu-alert--info wu-mb-6" style="text-align:left">
        <svg class="wu-alert__icon wu-icon"><use href="#i-shield"></use></svg>
        <div><div class="wu-alert__title">Shared device</div>Your account is fully closed on this Chromebook. Nothing you did is left open for anyone else.</div>
      </div>

      <div class="wu-stack wu-stack--sm">
        <a class="wu-btn wu-btn--primary wu-btn--block wu-btn--lg" href="./login.html">
          <svg class="wu-icon"><use href="#i-log-in"></use></svg>Sign in
        </a>
        <a class="wu-btn wu-btn--secondary wu-btn--block" href="./switch-user.html">
          <svg class="wu-icon"><use href="#i-refresh"></use></svg>Switch user
        </a>
      </div>
    </div>
  </div>
</body>
</html>
