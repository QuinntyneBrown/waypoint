name: backend

on:
  push:
    paths:
      [
        "backend/**",
        ".config/dotnet-tools.json",
        "global.json",
        "docs/specs/**",
        "scripts/**",
        ".github/workflows/backend.yml",
      ]
  pull_request:
    paths:
      [
        "backend/**",
        ".config/dotnet-tools.json",
        "global.json",
        "docs/specs/**",
        "scripts/**",
        ".github/workflows/backend.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_password123!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_password123! -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      WAYPOINT_TEST_SQLSERVER: "localhost"
      WAYPOINT_TEST_SQLAUTH: "User Id=sa;Password=Your_password123!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify stable SDK selection
        working-directory: backend
        run: dotnet --version
      - name: Restore
        run: dotnet restore backend/Waypoint.sln
      - name: Restore repository tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build backend/Waypoint.sln --no-restore --configuration Release
      - name: Verify migrations match the model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project backend/src/Waypoint.Infrastructure
          --startup-project backend/src/Waypoint.Api
          --configuration Release
          --no-build
      - name: Test (unit + integration)
        run: dotnet test backend/Waypoint.sln --no-build --configuration Release --logger "trx;LogFileName=test.trx"
      - name: Requirement traceability gate
        run: node scripts/check-traceability.mjs --strict
