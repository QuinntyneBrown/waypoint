name: frontend

on:
  push:
    paths:
      - "frontend/**"
      - "backend/src/**"
      - "global.json"
      - "docs/specs/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/src/**"
      - "global.json"
      - "docs/specs/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.4
      - run: npm ci
      - name: Route and navigation manifest
        run: npm run quality:routes
      - run: npm run format:check
      - name: Build applications and verify shared packages
        run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        run: dotnet build backend/Waypoint.sln
        working-directory: .
      - name: Use repository npm version
        run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E, responsive breakpoint, and WCAG 2.2 AA gates
        run: npm run e2e:ci
      - name: Isolated Chromebook-class youth performance gate
        run: npm run e2e:performance
      - name: Traceability gate
        run: node scripts/check-traceability.mjs --strict
        working-directory: .
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
