<w-settings-shell heading="Notifications">
  <p class="w-muted w-mb-6">
    Choose how you’d like to hear from Waypoint. Changes save automatically.
  </p>

  <div class="w-stack w-stack--lg">
    @for (cat of categories; track cat.eventKey) {
      <div>
        <div>{{ cat.label }}</div>
        <div class="w-muted w-text-sm w-mb-2">{{ cat.description }}</div>
        <div class="w-cluster">
          <label class="w-check">
            <input
              type="checkbox"
              [attr.aria-label]="cat.label + ' in-app'"
              [checked]="prefs()[cat.eventKey].inApp"
              (change)="toggle(cat.eventKey, 'inApp')"
            />
            <span class="w-check__box"></span>
            <span>In-app</span>
          </label>
          <label class="w-check">
            <input
              type="checkbox"
              [attr.aria-label]="cat.label + ' email'"
              [checked]="prefs()[cat.eventKey].email"
              (change)="toggle(cat.eventKey, 'email')"
            />
            <span class="w-check__box"></span>
            <span>Email</span>
          </label>
        </div>
      </div>
    }
  </div>
</w-settings-shell>
