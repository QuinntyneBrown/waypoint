<ph-shell [role]="role()" active="profile" [userName]="userName()" (signOut)="signOut()">
  <div class="ph-container ph-container--narrow ph-page">
    <div class="ph-page__head">
      <div class="ph-page__titles">
        <div class="ph-eyebrow">Settings</div>
        <h1 class="ph-page__title">{{ heading() }}</h1>
      </div>
    </div>
    <nav ph-tabs class="ph-mb-6" aria-label="Settings">
      <a
        ph-tab
        routerLink="/settings/profile"
        routerLinkActive
        #profile="routerLinkActive"
        [active]="profile.isActive"
        >Profile</a
      >
      <a
        ph-tab
        routerLink="/settings/notifications"
        routerLinkActive
        #notifications="routerLinkActive"
        [active]="notifications.isActive"
      >
        Notifications
      </a>
      <a
        ph-tab
        routerLink="/settings/display"
        routerLinkActive
        #display="routerLinkActive"
        [active]="display.isActive"
        >Display</a
      >
      <a
        ph-tab
        routerLink="/settings/privacy"
        routerLinkActive
        #privacy="routerLinkActive"
        [active]="privacy.isActive"
        >Privacy</a
      >
    </nav>
    <ng-content />
  </div>
</ph-shell>
