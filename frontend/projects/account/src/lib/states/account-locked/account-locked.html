<ph-state-page
  icon="lock"
  tone="error"
  eyebrow="Account locked"
  title="Too many sign-in attempts"
  [text]="message"
>
  <a ph-button variant="primary" routerLink="/auth/forgot-password">Reset password</a>
  <a ph-button variant="ghost" [href]="contactUrl">Contact your mentor</a>
</ph-state-page>
