<div class="ph-toasts" role="region" aria-live="polite" aria-label="Notifications">
  @for (t of toasts.toasts(); track t.id) {
    <div class="ph-toast ph-toast--{{ t.type }}">
      <span class="ph-toast__icon"><ph-icon [name]="iconFor(t.type)" /></span>
      <div class="ph-toast__body">
        @if (t.title) {
          <div class="ph-toast__title">{{ t.title }}</div>
        }
        {{ t.message }}
      </div>
      <button
        class="ph-toast__close"
        type="button"
        aria-label="Dismiss"
        (click)="toasts.dismiss(t.id)"
      >
        <ph-icon name="x" />
      </button>
    </div>
  }
</div>
