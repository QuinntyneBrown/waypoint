<div class="ph-authpage">
  <div ph-empty-state style="max-width: 460px">
    <div ph-empty-state-icon [style.background]="iconBg()" [style.color]="iconColor()">
      <ph-icon [name]="icon()" iconClass="ph-state-page__glyph" />
    </div>
    @if (eyebrow()) {
      <div class="ph-eyebrow">{{ eyebrow() }}</div>
    }
    <h1 ph-empty-state-title style="font-size: 1.6rem">{{ title() }}</h1>
    @if (text()) {
      <p ph-empty-state-text>{{ text() }}</p>
    }
    <div class="ph-cluster" style="justify-content: center">
      <ng-content />
    </div>
  </div>
</div>
