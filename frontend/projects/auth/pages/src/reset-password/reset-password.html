<div class="ph-authpage">
  <div class="ph-authcard">
    <div class="ph-authcard__brand">
      <div ph-brand size="lg">Waypoint</div>
    </div>
    <h1 style="font-size: 1.5rem; text-align: center">Set a new password</h1>
    <p class="ph-muted ph-text-c ph-mb-6">Choose a strong password you don’t use elsewhere.</p>

    @if (errorMessage()) {
      <div ph-alert variant="error" icon="alert-circle" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div ph-form-field [invalid]="confirmTouched() && !policyOk()">
        <label ph-label for="new-password">New password</label>
        <div style="position: relative">
          <input
            ph-text-field
            id="new-password"
            [type]="showNew() ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="newPassword"
            placeholder="••••••••"
          />
          <button
            ph-icon-button
            type="button"
            style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%)"
            [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showNew()"
            (click)="showNew.set(!showNew())"
          >
            <ph-icon [name]="showNew() ? 'eye-off' : 'eye'" />
          </button>
        </div>
        @if (confirmTouched() && !policyOk()) {
          <div ph-error-text>{{ policyMessage }}</div>
        } @else {
          <div ph-help>{{ policyMessage }}</div>
        }
      </div>

      <div ph-form-field [invalid]="confirmTouched() && !matches()">
        <label ph-label for="confirm-password">Confirm password</label>
        <div style="position: relative">
          <input
            ph-text-field
            id="confirm-password"
            [type]="showConfirm() ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="confirmPassword"
            placeholder="••••••••"
          />
          <button
            ph-icon-button
            type="button"
            style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%)"
            [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showConfirm()"
            (click)="showConfirm.set(!showConfirm())"
          >
            <ph-icon [name]="showConfirm() ? 'eye-off' : 'eye'" />
          </button>
        </div>
        @if (confirmTouched() && !matches()) {
          <div ph-error-text>Passwords do not match.</div>
        }
      </div>

      <button
        ph-button
        variant="primary"
        block
        size="lg"
        class="ph-mt-4"
        type="submit"
        [class.is-loading]="submitting()"
        [disabled]="!canSubmit() || submitting()"
      >
        Reset password
      </button>
    </form>
  </div>
</div>
