<div class="w-authpage">
  <div class="w-authcard">
    <div class="w-authcard__brand">
      <span class="w-brand__mark" style="width: 38px; height: 38px; font-size: 1.1rem">W</span>
      <span style="font-family: var(--w-font-head); font-weight: 700; font-size: 1.2rem"
        >Waypoint</span
      >
    </div>
    <h1 style="font-size: 1.5rem; text-align: center">Set a new password</h1>
    <p class="w-muted w-text-c w-mb-6">Choose a strong password you don’t use elsewhere.</p>

    @if (errorMessage()) {
      <div class="w-alert w-alert--error" role="alert">
        <w-icon name="alert-circle" iconClass="w-alert__icon" />
        <div>{{ errorMessage() }}</div>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div w-form-field [invalid]="confirmTouched() && !policyOk()">
        <label w-label for="new-password">New password</label>
        <div style="position: relative">
          <input
            class="w-input"
            id="new-password"
            [type]="showNew() ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="newPassword"
            placeholder="••••••••"
          />
          <button
            w-icon-button
            type="button"
            style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%)"
            [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showNew()"
            (click)="showNew.set(!showNew())"
          >
            <w-icon [name]="showNew() ? 'eye-off' : 'eye'" />
          </button>
        </div>
        @if (confirmTouched() && !policyOk()) {
          <div w-error-text>{{ policyMessage }}</div>
        } @else {
          <div w-help>{{ policyMessage }}</div>
        }
      </div>

      <div w-form-field [invalid]="confirmTouched() && !matches()">
        <label w-label for="confirm-password">Confirm password</label>
        <div style="position: relative">
          <input
            class="w-input"
            id="confirm-password"
            [type]="showConfirm() ? 'text' : 'password'"
            autocomplete="new-password"
            formControlName="confirmPassword"
            placeholder="••••••••"
          />
          <button
            w-icon-button
            type="button"
            style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%)"
            [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showConfirm()"
            (click)="showConfirm.set(!showConfirm())"
          >
            <w-icon [name]="showConfirm() ? 'eye-off' : 'eye'" />
          </button>
        </div>
        @if (confirmTouched() && !matches()) {
          <div w-error-text>Passwords do not match.</div>
        }
      </div>

      <button
        w-button
        variant="primary"
        block
        size="lg"
        class="w-mt-4"
        type="submit"
        [class.is-loading]="submitting()"
        [disabled]="!canSubmit() || submitting()"
      >
        Reset password
      </button>
    </form>
  </div>
</div>
