<div class="w-authpage">
  <div class="w-authcard">
    <div class="w-authcard__brand">
      <span class="w-brand__mark" style="width: 38px; height: 38px; font-size: 1.1rem">W</span>
      <span style="font-family: var(--w-font-head); font-weight: 700; font-size: 1.2rem"
        >Waypoint</span
      >
    </div>
    <h1 style="font-size: 1.5rem; text-align: center">Reset your password</h1>
    <p class="w-muted w-text-c w-mb-6">Enter your email and we’ll send a link to set a new one.</p>

    @if (errorMessage()) {
      <div class="w-alert w-alert--error" role="alert">
        <w-icon name="alert-circle" iconClass="w-alert__icon" />
        <div>{{ errorMessage() }}</div>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div
        class="w-field"
        [class.is-error]="form.controls.email.touched && form.controls.email.invalid"
      >
        <label class="w-label" for="email">Email</label>
        <input
          class="w-input"
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
          placeholder="you@example.com"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <div class="w-error-text">Enter a valid email address.</div>
        }
      </div>

      <button
        w-button
        variant="primary"
        block
        size="lg"
        class="w-mt-4"
        type="submit"
        [class.is-loading]="submitting()"
        [disabled]="submitting()"
      >
        Send reset link
      </button>
    </form>

    <p class="w-text-c w-mt-6 w-text-sm"><a routerLink="/auth/sign-in">Back to sign in</a></p>
  </div>
</div>
