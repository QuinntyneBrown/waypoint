<div class="ph-authpage">
  <div class="ph-authcard">
    <div class="ph-authcard__brand">
      <div ph-brand size="lg">Waypoint</div>
    </div>
    <h1 style="font-size: 1.5rem; text-align: center">Reset your password</h1>
    <p class="ph-muted ph-text-c ph-mb-6">
      Enter your email and we’ll send a link to set a new one.
    </p>

    @if (errorMessage()) {
      <div ph-alert variant="error" icon="alert-circle" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div ph-form-field [invalid]="form.controls.email.touched && form.controls.email.invalid">
        <label ph-label for="email">Email</label>
        <input
          ph-text-field
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
          placeholder="you@example.com"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <div ph-error-text>Enter a valid email address.</div>
        }
      </div>

      <button
        ph-button
        variant="primary"
        block
        size="lg"
        class="ph-mt-4"
        type="submit"
        [class.is-loading]="submitting()"
        [disabled]="submitting()"
      >
        Send reset link
      </button>
    </form>

    <p class="ph-text-c ph-mt-6 ph-text-sm"><a routerLink="/auth/sign-in">Back to sign in</a></p>
  </div>
</div>
