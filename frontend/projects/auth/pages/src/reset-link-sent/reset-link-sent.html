<ph-state-page
  icon="mail"
  tone="info"
  eyebrow="Reset link sent"
  title="Check your email"
  [text]="bodyText"
>
  <button ph-button variant="ghost" type="button" (click)="resend()">Resend link</button>
  <a ph-button variant="primary" routerLink="/auth/sign-in">Back to sign in</a>
</ph-state-page>
