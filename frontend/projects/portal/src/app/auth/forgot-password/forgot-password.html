<div class="wu-authpage">
  <div class="wu-authcard">
    <div class="wu-authcard__brand">
      <span class="wu-brand__mark" style="width: 38px; height: 38px; font-size: 1.1rem">W</span>
      <span style="font-family: var(--wu-font-head); font-weight: 700; font-size: 1.2rem"
        >Word Up</span
      >
    </div>
    <h1 style="font-size: 1.5rem; text-align: center">Reset your password</h1>
    <p class="wu-muted wu-text-c wu-mb-6">
      Enter your email and we’ll send a link to set a new one.
    </p>

    @if (errorMessage()) {
      <div class="wu-alert wu-alert--error" role="alert">
        <svg class="wu-alert__icon wu-icon"><use href="#i-alert-circle"></use></svg>
        <div>{{ errorMessage() }}</div>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div
        class="wu-field"
        [class.is-error]="form.controls.email.touched && form.controls.email.invalid"
      >
        <label class="wu-label" for="email">Email</label>
        <input
          class="wu-input"
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
          placeholder="you@example.com"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <div class="wu-error-text">Enter a valid email address.</div>
        }
      </div>

      <button
        class="wu-btn wu-btn--primary wu-btn--block wu-btn--lg wu-mt-4"
        type="submit"
        [class.is-loading]="submitting()"
        [disabled]="submitting()"
      >
        Send reset link
      </button>
    </form>

    <p class="wu-text-c wu-mt-6 wu-text-sm"><a routerLink="/auth/sign-in">Back to sign in</a></p>
  </div>
</div>
