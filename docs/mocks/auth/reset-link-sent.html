<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../assets/css/wordup.css">
  <script defer src="../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-authcard wu-text-c">
      <div class="wu-authcard__brand">
        <span class="wu-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--wu-font-head);font-weight:700;font-size:1.2rem">Word Up</span>
      </div>

      <div class="wu-modal__icon wu-modal__icon--lime" style="margin-inline:auto">
        <svg class="wu-icon"><use href="#i-mail"></use></svg>
      </div>

      <h1 style="font-size:1.5rem">Check your email</h1>
      <p class="wu-muted wu-mb-6">We sent a reset link to <strong>j****@email.com</strong>. Open it on this device to set a new password.</p>

      <a class="wu-btn wu-btn--primary wu-btn--block wu-btn--lg" href="./reset-password.html">Open reset link</a>

      <p class="wu-mt-6 wu-text-sm wu-muted">Didn’t get it? Check spam, or
        <a href="#" data-toast="Reset link re-sent" data-toast-type="success">resend the email</a>.
      </p>

      <div class="wu-divider"></div>
      <p class="wu-text-sm">
        <a href="./login.html"><svg class="wu-icon" style="vertical-align:-3px"><use href="#i-arrow-left"></use></svg> Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
