<!doctype html>
<!-- COPY into a role folder (mentor/, admin/). Desktop shell = sidenav + dense tables. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<!-- data-role: mentor | admin   data-active: nav item key (see NAV in waypoint.js) -->
<body data-role="admin" data-active="dashboard" data-track="bible">
  <main class="ph-main">
    <div class="ph-container ph-page">
      <div class="ph-page__head">
        <div class="ph-page__titles">
          <div class="ph-eyebrow">Section</div>
          <h1 class="ph-page__title">Page title</h1>
          <p class="ph-page__sub">Short description of this page.</p>
        </div>
        <div class="ph-page__actions">
          <button class="ph-btn ph-btn--ghost"><svg class="ph-icon"><use href="#i-download"></use></svg>Export</button>
          <button class="ph-btn ph-btn--primary" data-open-modal="m-example"><svg class="ph-icon"><use href="#i-plus"></use></svg>Primary action</button>
        </div>
      </div>

      <!-- ===== page content ===== -->
      <div class="ph-grid ph-grid--3">
        <div class="ph-card"><div class="ph-card__body">Card content</div></div>
      </div>
    </div>
  </main>

  <!-- ===== page-scoped modals (hidden until opened) ===== -->
  <div class="ph-modal ph-modal--sm" id="m-example" role="dialog" aria-modal="true">
    <div class="ph-modal__scrim"></div>
    <div class="ph-modal__panel">
      <div class="ph-modal__header">
        <div><h2 class="ph-modal__title">Modal title</h2></div>
        <button class="ph-iconbtn ph-modal__close" data-close-modal aria-label="Close"><svg class="ph-icon"><use href="#i-x"></use></svg></button>
      </div>
      <div class="ph-modal__body"><p class="ph-muted">Modal body content.</p></div>
      <div class="ph-modal__footer">
        <button class="ph-btn ph-btn--ghost" data-close-modal>Cancel</button>
        <button class="ph-btn ph-btn--primary" data-close-modal data-toast="Done" data-toast-type="success">Confirm</button>
      </div>
    </div>
  </div>
</body>
</html>
