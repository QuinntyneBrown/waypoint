<!doctype html>
<!-- COPY into states/. Full-page system/error state. No app shell. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../assets/css/wordup.css">
  <script defer src="../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-empty" style="max-width:460px">
      <div class="wu-empty__icon" style="width:80px;height:80px;background:var(--wu-warning-bg)">
        <svg class="wu-icon" style="width:38px;height:38px;color:var(--wu-warning)"><use href="#i-alert-triangle"></use></svg>
      </div>
      <div class="wu-eyebrow">Error 500</div>
      <h1 class="wu-empty__title" style="font-size:1.6rem">Something went wrong</h1>
      <p class="wu-empty__text">We hit a snag on our end. Please try again in a moment.</p>
      <div class="wu-cluster" style="justify-content:center">
        <button class="wu-btn wu-btn--ghost" onclick="location.reload()">Try again</button>
        <a class="wu-btn wu-btn--primary" href="../index.html">Back to start</a>
      </div>
    </div>
  </div>
</body>
</html>
