<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Waypoint · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-authcard" style="max-width:520px">
      <div class="ph-authcard__brand">
        <span class="ph-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--font-family-heading);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>

      <h1 style="font-size:1.5rem;text-align:center">Let's set you up</h1>
      <p class="ph-muted ph-text-c ph-mb-6">A few quick steps and you're ready to go.</p>

      <div class="ph-segment ph-mb-6" role="tablist" aria-label="Setup steps">
        <span class="ph-segment__item is-active">1 · You</span>
        <span class="ph-segment__item">2 · Cohort</span>
        <span class="ph-segment__item">3 · Alerts</span>
      </div>

      <!-- STEP 1 (active) -->
      <div class="ph-stack">
        <div class="ph-cluster" style="justify-content:center">
          <span class="ph-avatar ph-avatar--xl" data-name="Jayden Alcantara"></span>
          <button class="ph-btn ph-btn--secondary ph-btn--sm" type="button" data-toast="Camera not available in demo" data-toast-type="info">
            <svg class="ph-icon"><use href="#i-camera"></use></svg>Add photo
          </button>
        </div>
        <p class="ph-muted ph-text-c ph-text-sm">Photo is optional — you can add one anytime from your profile.</p>

        <div class="ph-field">
          <label class="ph-label" for="dname">Display name <span class="ph-label__req">*</span></label>
          <input class="ph-input" id="dname" type="text" value="Jayden Alcantara">
        </div>
        <div class="ph-field">
          <label class="ph-label" for="pron">Pronouns</label>
          <select class="ph-select" id="pron">
            <option>Prefer not to say</option>
            <option>He / him</option>
            <option>She / her</option>
            <option>They / them</option>
          </select>
        </div>
      </div>

      <!-- STEP 2 (inert preview) -->
      <div class="ph-card ph-card--greige ph-mt-6" aria-hidden="true">
        <div class="ph-card__body">
          <div class="ph-eyebrow">Step 2 · Confirm your cohort</div>
          <div class="ph-person ph-mt-4">
            <span class="ph-avatar" data-name="Marcus Bello"></span>
            <div>
              <div class="ph-person__name">Rexdale Fall '25</div>
              <div class="ph-person__meta">Mentor Marcus Bello · Sep–Dec 2025</div>
            </div>
          </div>
        </div>
      </div>

      <!-- STEP 3 (inert preview) -->
      <div class="ph-card ph-card--greige ph-mt-4" aria-hidden="true">
        <div class="ph-card__body">
          <div class="ph-eyebrow ph-mb-4">Step 3 · Notifications</div>
          <label class="ph-switch"><input type="checkbox" checked disabled><span class="ph-switch__track"></span><span>Lesson reminders</span></label>
          <label class="ph-switch"><input type="checkbox" checked disabled><span class="ph-switch__track"></span><span>Mentor messages</span></label>
          <label class="ph-switch"><input type="checkbox" disabled><span class="ph-switch__track"></span><span>Announcements</span></label>
        </div>
      </div>

      <div class="ph-cluster ph-mt-6" style="justify-content:space-between">
        <a class="ph-btn ph-btn--ghost" href="../../learning-experience/youth/home.html">Skip for now</a>
        <button class="ph-btn ph-btn--primary ph-btn--lg" data-toast="You're all set!" data-toast-type="success" data-toast-title="Welcome" data-then="learning-experience/youth/home.html">Finish</button>
      </div>
    </div>
  </div>
</body>
</html>
