<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account locked · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-authcard ph-text-c">
      <div class="ph-modal__icon ph-modal__icon--warning" style="margin-inline:auto">
        <svg class="ph-icon"><use href="#i-lock"></use></svg>
      </div>

      <h1 style="font-size:1.5rem">Account locked</h1>
      <p class="ph-muted ph-mb-6" style="max-width:40ch;margin-inline:auto">
        Too many sign-in attempts. For your safety we've paused this account. Try again in <strong>15 minutes</strong> or reset your password now.
      </p>

      <div class="ph-alert ph-alert--warning ph-mb-6" style="text-align:left">
        <svg class="ph-alert__icon ph-icon"><use href="#i-clock"></use></svg>
        <div><div class="ph-alert__title">Locked for 15 minutes</div>You can still reset your password or reach out for help below.</div>
      </div>

      <div class="ph-stack ph-stack--sm">
        <a class="ph-btn ph-btn--primary ph-btn--block ph-btn--lg" href="forgot-password.html">
          <svg class="ph-icon"><use href="#i-refresh"></use></svg>Reset password
        </a>
        <a class="ph-btn ph-btn--secondary ph-btn--block" href="../../engagement/youth/messages.html">
          <svg class="ph-icon"><use href="#i-message-square"></use></svg>Contact your mentor
        </a>
      </div>

      <p class="ph-text-c ph-mt-6 ph-text-sm ph-muted">Remembered it? <a href="login.html">Back to sign in</a></p>
    </div>
  </div>
</body>
</html>
