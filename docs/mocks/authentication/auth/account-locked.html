<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account locked · Word Up</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../../assets/css/wordup.css">
  <script defer src="../../assets/js/wordup.js"></script>
</head>
<body>
  <div class="wu-authpage">
    <div class="wu-authcard wu-text-c">
      <div class="wu-modal__icon wu-modal__icon--warning" style="margin-inline:auto">
        <svg class="wu-icon"><use href="#i-lock"></use></svg>
      </div>

      <h1 style="font-size:1.5rem">Account locked</h1>
      <p class="wu-muted wu-mb-6" style="max-width:40ch;margin-inline:auto">
        Too many sign-in attempts. For your safety we've paused this account. Try again in <strong>15 minutes</strong> or reset your password now.
      </p>

      <div class="wu-alert wu-alert--warning wu-mb-6" style="text-align:left">
        <svg class="wu-alert__icon wu-icon"><use href="#i-clock"></use></svg>
        <div><div class="wu-alert__title">Locked for 15 minutes</div>You can still reset your password or reach out for help below.</div>
      </div>

      <div class="wu-stack wu-stack--sm">
        <a class="wu-btn wu-btn--primary wu-btn--block wu-btn--lg" href="forgot-password.html">
          <svg class="wu-icon"><use href="#i-refresh"></use></svg>Reset password
        </a>
        <a class="wu-btn wu-btn--secondary wu-btn--block" href="../../engagement/youth/messages.html">
          <svg class="wu-icon"><use href="#i-message-square"></use></svg>Contact your mentor
        </a>
      </div>

      <p class="wu-text-c wu-mt-6 wu-text-sm wu-muted">Remembered it? <a href="login.html">Back to sign in</a></p>
    </div>
  </div>
</body>
</html>
