<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/assets/fonts.css"><link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="w-authpage">
    <div class="w-authcard w-text-c">
      <div class="w-authcard__brand" style="justify-content:center">
        <span class="w-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--font-family-heading);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>

      <div class="w-modal__icon w-modal__icon--success" style="margin-inline:auto">
        <svg class="w-icon"><use href="#i-check-circle"></use></svg>
      </div>

      <h1 style="font-size:1.75rem">You've been signed out</h1>
      <p class="w-mb-6" style="font-size:1.15rem;max-width:32ch;margin-inline:auto">
        This device is ready for the next person.
      </p>

      <div class="w-alert w-alert--info w-mb-6" style="text-align:left">
        <svg class="w-alert__icon w-icon"><use href="#i-shield"></use></svg>
        <div><div class="w-alert__title">Shared device</div>Your account is fully closed on this Chromebook. Nothing you did is left open for anyone else.</div>
      </div>

      <div class="w-stack w-stack--sm">
        <a class="w-btn w-btn--primary w-btn--block w-btn--lg" href="login.html">
          <svg class="w-icon"><use href="#i-log-in"></use></svg>Sign in
        </a>
      </div>
    </div>
  </div>
</body>
</html>
