<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-authcard ph-text-c">
      <div class="ph-authcard__brand">
        <span class="ph-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--font-family-heading);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>

      <div class="ph-modal__icon ph-modal__icon--lime" style="margin-inline:auto">
        <svg class="ph-icon"><use href="#i-mail"></use></svg>
      </div>

      <h1 style="font-size:1.5rem">Check your email</h1>
      <p class="ph-muted ph-mb-6">We sent a reset link to <strong>j****@email.com</strong>. Open it on this device to set a new password.</p>

      <a class="ph-btn ph-btn--primary ph-btn--block ph-btn--lg" href="reset-password.html">Open reset link</a>

      <p class="ph-mt-6 ph-text-sm ph-muted">Didn’t get it? Check spam, or
        <a href="#" data-toast="Reset link re-sent" data-toast-type="success">resend the email</a>.
      </p>

      <div class="ph-divider"></div>
      <p class="ph-text-sm">
        <a href="login.html"><svg class="ph-icon" style="vertical-align:-3px"><use href="#i-arrow-left"></use></svg> Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
