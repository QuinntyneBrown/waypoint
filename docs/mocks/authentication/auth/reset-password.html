<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-authcard">
      <div class="ph-authcard__brand">
        <span class="ph-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--font-family-heading);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>
      <h1 style="font-size:1.5rem;text-align:center">Set a new password</h1>
      <p class="ph-muted ph-text-c ph-mb-6">Choose something you’ll remember. At least 8 characters.</p>

      <form onsubmit="event.preventDefault()">
        <div class="ph-field">
          <label class="ph-label" for="pw1">New password</label>
          <div class="ph-inputgroup">
            <input class="ph-input" id="pw1" type="password" placeholder="••••••••">
            <button class="ph-inputgroup__addon" type="button" id="toggle-pw" aria-label="Show password"
              style="cursor:pointer" onclick="togglePw()">
              <svg class="ph-icon" id="eye-icon"><use href="#i-eye"></use></svg>
            </button>
          </div>
          <div class="ph-help">Use 8+ characters with a mix of letters and numbers.</div>
        </div>
        <div class="ph-field">
          <label class="ph-label" for="pw2">Confirm new password</label>
          <input class="ph-input" id="pw2" type="password" placeholder="••••••••">
        </div>
        <button class="ph-btn ph-btn--primary ph-btn--block ph-btn--lg" type="button"
          data-toast="Password updated" data-toast-type="success" data-then="authentication/auth/reset-success.html">Update password</button>
      </form>

      <p class="ph-text-c ph-mt-6 ph-text-sm">
        <a href="login.html"><svg class="ph-icon" style="vertical-align:-3px"><use href="#i-arrow-left"></use></svg> Back to sign in</a>
      </p>
    </div>
  </div>

  <script>
    function togglePw() {
      var f1 = document.getElementById("pw1");
      var f2 = document.getElementById("pw2");
      var icon = document.getElementById("eye-icon").querySelector("use");
      var btn = document.getElementById("toggle-pw");
      var show = f1.type === "password";
      f1.type = f2.type = show ? "text" : "password";
      icon.setAttribute("href", show ? "#i-eye-off" : "#i-eye");
      btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    }
  </script>
</body>
</html>
