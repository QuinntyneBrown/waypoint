<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-authcard">
      <div class="ph-authcard__brand">
        <span class="ph-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--font-family-heading);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>
      <h1 style="font-size:1.5rem;text-align:center">Forgot your password?</h1>
      <p class="ph-muted ph-text-c ph-mb-6">Enter your email and we’ll send you a link to reset it.</p>

      <form onsubmit="event.preventDefault()">
        <div class="ph-field">
          <label class="ph-label" for="email">Email</label>
          <input class="ph-input" id="email" type="email" placeholder="you@example.com" value="jayden@email.com">
          <div class="ph-help">Use the email your mentor has on file.</div>
        </div>
        <button class="ph-btn ph-btn--primary ph-btn--block ph-btn--lg" type="button"
          data-toast="Reset link sent" data-toast-type="success" data-then="authentication/auth/reset-link-sent.html">Send reset link</button>
      </form>

      <p class="ph-text-c ph-mt-6 ph-text-sm">
        <a href="login.html"><svg class="ph-icon" style="vertical-align:-3px"><use href="#i-arrow-left"></use></svg> Back to sign in</a>
      </p>
    </div>
  </div>
</body>
</html>
