<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../../assets/css/waypoint.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="w-authpage">
    <div class="w-authcard">
      <div class="w-authcard__brand">
        <span class="w-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--w-font-head);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>
      <h1 style="font-size:1.5rem;text-align:center">Welcome back</h1>
      <p class="w-muted w-text-c w-mb-6">Sign in to continue your journey.</p>

      <!-- Inline error example: add "is-error" to the email field below to preview the error state (off by default). -->
      <form onsubmit="event.preventDefault()">
        <div class="w-field">
          <label class="w-label" for="email">Email</label>
          <input class="w-input" id="email" type="email" placeholder="you@example.com" value="jayden@email.com">
          <div class="w-error-text">We don’t recognize that email.</div>
        </div>
        <div class="w-field">
          <label class="w-label" for="pw">Password</label>
          <input class="w-input" id="pw" type="password" placeholder="••••••••">
        </div>

        <div class="w-cluster w-justify-between w-mb-4">
          <label class="w-check" style="margin-bottom:0">
            <input type="checkbox">
            <span class="w-check__box"><svg class="w-icon"><use href="#i-check"></use></svg></span>
            <span>Remember me</span>
          </label>
          <a class="w-text-sm" href="forgot-password.html">Forgot password?</a>
        </div>
        <p class="w-help w-mb-6" style="margin-top:0">Not recommended on shared devices.</p>

        <button class="w-btn w-btn--primary w-btn--block w-btn--lg" type="button"
          data-toast="Signed in" data-toast-type="success" data-toast-title="Welcome back" data-then="learning-experience/youth/home.html">Sign in</button>
      </form>

      <div class="w-cluster w-gap-3 w-mt-6 w-mb-6" style="flex-wrap:nowrap">
        <span class="w-divider" style="flex:1;margin-block:0"></span>
        <span class="w-muted w-text-sm">or</span>
        <span class="w-divider" style="flex:1;margin-block:0"></span>
      </div>

      <button class="w-btn w-btn--ghost w-btn--block w-btn--lg" type="button"
        data-toast="Continuing with Google (demo)" data-toast-type="info">
        <svg class="w-icon"><use href="#i-log-in"></use></svg>Sign in with Google</button>

      <p class="w-text-c w-mt-6 w-text-sm"><a href="pin-login.html">Use a PIN instead</a></p>
      <p class="w-text-c w-mt-4 w-text-sm w-muted">New here? Ask your mentor for an invite.</p>
    </div>
  </div>
</body>
</html>
