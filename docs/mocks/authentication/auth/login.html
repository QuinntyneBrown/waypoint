<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-authcard">
      <div class="ph-authcard__brand">
        <span class="ph-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--font-family-heading);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>
      <h1 style="font-size:1.5rem;text-align:center">Welcome back</h1>
      <p class="ph-muted ph-text-c ph-mb-6">Sign in to continue your journey.</p>

      <!-- Inline error example: add "is-error" to the email field below to preview the error state (off by default). -->
      <form onsubmit="event.preventDefault()">
        <div class="ph-field">
          <label class="ph-label" for="email">Email</label>
          <input class="ph-input" id="email" type="email" placeholder="you@example.com" value="jayden@email.com">
          <div class="ph-error-text">We don’t recognize that email.</div>
        </div>
        <div class="ph-field">
          <label class="ph-label" for="pw">Password</label>
          <input class="ph-input" id="pw" type="password" placeholder="••••••••">
        </div>

        <div class="ph-cluster ph-justify-between ph-mb-4">
          <label class="ph-check" style="margin-bottom:0">
            <input type="checkbox">
            <span class="ph-check__box"><svg class="ph-icon"><use href="#i-check"></use></svg></span>
            <span>Remember me</span>
          </label>
          <a class="ph-text-sm" href="forgot-password.html">Forgot password?</a>
        </div>
        <p class="ph-help ph-mb-6" style="margin-top:0">Not recommended on shared devices.</p>

        <button class="ph-btn ph-btn--primary ph-btn--block ph-btn--lg" type="button"
          data-toast="Signed in" data-toast-type="success" data-toast-title="Welcome back" data-then="learning-experience/youth/home.html">Sign in</button>
      </form>

      <div class="ph-cluster ph-gap-3 ph-mt-6 ph-mb-6" style="flex-wrap:nowrap">
        <span class="ph-divider" style="flex:1;margin-block:0"></span>
        <span class="ph-muted ph-text-sm">or</span>
        <span class="ph-divider" style="flex:1;margin-block:0"></span>
      </div>

      <button class="ph-btn ph-btn--ghost ph-btn--block ph-btn--lg" type="button"
        data-toast="Continuing with Google (demo)" data-toast-type="info">
        <svg class="ph-icon"><use href="#i-log-in"></use></svg>Sign in with Google</button>

      <p class="ph-text-c ph-mt-4 ph-text-sm ph-muted">New here? Ask your mentor for an invite.</p>
    </div>
  </div>
</body>
</html>
