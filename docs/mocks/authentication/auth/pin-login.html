<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIN sign-in · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../../assets/css/waypoint.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="w-authpage">
    <div class="w-authcard w-text-c">
      <div class="w-authcard__brand">
        <span class="w-brand__mark" style="width:38px;height:38px;font-size:1.1rem">W</span>
        <span style="font-family:var(--w-font-head);font-weight:700;font-size:1.2rem">Waypoint</span>
      </div>
      <h1 style="font-size:1.5rem">Enter your PIN</h1>
      <p class="w-muted w-mb-6">Type the 4-digit PIN for <strong>Jayden Alcantara</strong> to jump back in.</p>

      <form onsubmit="event.preventDefault()">
        <div class="w-cluster" style="justify-content:center;gap:12px" id="pin-boxes">
          <input class="w-input" inputmode="numeric" maxlength="1" aria-label="PIN digit 1"
            style="width:60px;height:68px;text-align:center;font-size:1.8rem;font-weight:700">
          <input class="w-input" inputmode="numeric" maxlength="1" aria-label="PIN digit 2"
            style="width:60px;height:68px;text-align:center;font-size:1.8rem;font-weight:700">
          <input class="w-input" inputmode="numeric" maxlength="1" aria-label="PIN digit 3"
            style="width:60px;height:68px;text-align:center;font-size:1.8rem;font-weight:700">
          <input class="w-input" inputmode="numeric" maxlength="1" aria-label="PIN digit 4"
            style="width:60px;height:68px;text-align:center;font-size:1.8rem;font-weight:700">
        </div>
        <p class="w-help w-text-c w-mb-6" style="margin-top:12px">
          <svg class="w-icon" style="vertical-align:-3px"><use href="#i-help-circle"></use></svg>
          Ask your mentor for your PIN if you’ve forgotten it.
        </p>
        <button class="w-btn w-btn--primary w-btn--block w-btn--lg" type="button"
          data-toast="Signed in" data-toast-type="success" data-toast-title="Welcome back" data-then="learning-experience/youth/home.html">Continue</button>
      </form>

      <div class="w-divider"></div>
      <p class="w-text-sm">
        <a href="login.html">Use email &amp; password instead</a>
      </p>
    </div>
  </div>

  <script>
    // Tiny auto-advance for the PIN boxes (numeric keypad hint via inputmode).
    (function () {
      var boxes = Array.prototype.slice.call(document.querySelectorAll("#pin-boxes .w-input"));
      boxes.forEach(function (box, i) {
        box.addEventListener("input", function () {
          box.value = box.value.replace(/[^0-9]/g, "");
          if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
        });
        box.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
        });
      });
    })();
  </script>
</body>
</html>
