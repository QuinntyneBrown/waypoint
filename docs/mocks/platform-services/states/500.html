<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/assets/fonts.css"><link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="w-authpage">
    <div class="w-empty" style="max-width:460px">
      <div class="w-empty__icon" style="width:80px;height:80px;background:var(--color-warning-bg)">
        <svg class="w-icon" style="width:38px;height:38px;color:var(--color-warning-fg)"><use href="#i-alert-triangle"></use></svg>
      </div>
      <div class="w-eyebrow">Error 500</div>
      <h1 class="w-empty__title" style="font-size:1.6rem">Something went wrong on our end</h1>
      <p class="w-empty__text">That’s on us, not you. The team has been notified. Give it a moment and try again — your progress is safe.</p>
      <div class="w-cluster" style="justify-content:center">
        <button class="w-btn w-btn--primary" onclick="location.reload()"><svg class="w-icon"><use href="#i-refresh"></use></svg>Try again</button>
        <a class="w-btn w-btn--ghost" href="../../index.html"><svg class="w-icon"><use href="#i-arrow-left"></use></svg>Back to start</a>
      </div>
    </div>
  </div>
</body>
</html>
