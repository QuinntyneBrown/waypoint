<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session expired · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c6fb50'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%2316160c'>W</text></svg>">
  <link rel="stylesheet" href="../../assets/css/waypoint.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="w-authpage">
    <div class="w-empty" style="max-width:460px">
      <div class="w-empty__icon" style="width:80px;height:80px">
        <svg class="w-icon" style="width:38px;height:38px"><use href="#i-clock"></use></svg>
      </div>
      <div class="w-eyebrow">Session ended</div>
      <h1 class="w-empty__title" style="font-size:1.6rem">For your security, you were signed out</h1>
      <p class="w-empty__text">You’ve been away for a while, so we signed you out to keep your account safe — especially handy on shared devices.</p>
      <div class="w-alert w-alert--success" style="text-align:left;max-width:400px;margin:0 auto var(--w-s6)">
        <svg class="w-alert__icon w-icon"><use href="#i-check-circle"></use></svg>
        <div><div class="w-alert__title">Your draft was saved</div>We saved your reflection where we could, so you can pick up right where you left off.</div>
      </div>
      <div class="w-cluster" style="justify-content:center">
        <a class="w-btn w-btn--primary" href="../../authentication/auth/login.html"><svg class="w-icon"><use href="#i-log-in"></use></svg>Sign in again</a>
      </div>
    </div>
  </div>
</body>
</html>
