<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session expired · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-empty" style="max-width:460px">
      <div class="ph-empty__icon" style="width:80px;height:80px">
        <svg class="ph-icon" style="width:38px;height:38px"><use href="#i-clock"></use></svg>
      </div>
      <div class="ph-eyebrow">Session ended</div>
      <h1 class="ph-empty__title" style="font-size:1.6rem">For your security, you were signed out</h1>
      <p class="ph-empty__text">You’ve been away for a while, so we signed you out to keep your account safe — especially handy on shared devices.</p>
      <div class="ph-alert ph-alert--success" style="text-align:left;max-width:400px;margin:0 auto var(--space-6)">
        <svg class="ph-alert__icon ph-icon"><use href="#i-check-circle"></use></svg>
        <div><div class="ph-alert__title">Your draft was saved</div>We saved your reflection where we could, so you can pick up right where you left off.</div>
      </div>
      <div class="ph-cluster" style="justify-content:center">
        <a class="ph-btn ph-btn--primary" href="../../authentication/auth/login.html"><svg class="ph-icon"><use href="#i-log-in"></use></svg>Sign in again</a>
      </div>
    </div>
  </div>
</body>
</html>
