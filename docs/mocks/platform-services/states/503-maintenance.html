<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance · Waypoint</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffffff'>W</text></svg>">
  <link rel="stylesheet" href="../../../design-system/tokens/tokens.css"><link rel="stylesheet" href="../../../design-system/assets/components.css">
  <script defer src="../../assets/js/waypoint.js"></script>
</head>
<body>
  <div class="ph-authpage">
    <div class="ph-empty" style="max-width:460px">
      <div class="ph-empty__icon" style="width:80px;height:80px;background:var(--color-info-bg)">
        <svg class="ph-icon" style="width:38px;height:38px;color:var(--color-info-fg)"><use href="#i-clock"></use></svg>
      </div>
      <div class="ph-eyebrow">Maintenance · 503</div>
      <h1 class="ph-empty__title" style="font-size:1.6rem">Waypoint is getting an update — back soon</h1>
      <p class="ph-empty__text">We’re making things better behind the scenes. This usually takes a few minutes. Nothing you’ve done is lost — everything will be right where you left it.</p>
      <div class="ph-scripture" style="max-width:400px;margin:0 auto var(--space-6)">“Be still, and know that I am God.”<span class="ph-scripture__ref">Psalm 46:10</span></div>
      <div class="ph-cluster" style="justify-content:center">
        <button class="ph-btn ph-btn--primary" onclick="location.reload()"><svg class="ph-icon"><use href="#i-refresh"></use></svg>Check again</button>
      </div>
    </div>
  </div>
</body>
</html>
